# Online Course Assistant 配置模板
# 复制本文件为 config.toml 后修改。config.toml 已被 .gitignore 忽略，不会泄露账号。

[account]
# 留空则运行时在浏览器里手动登录，程序会自动保存 Cookie，下次免密
username = ""
password = ""
# 留空按地址识别；也可填知道智慧树 / 超星学习通 / 智慧职教
platform = ""

# 其他账号建议在图形界面新增；每条地址保存 account_id 进行绑定。
# [[account.list]]
# id = "account_1"
# name = "账号 1"
# platform = ""
# username = ""
# password = ""

[browser]
# chrome / edge / chromium
channel = "chrome"
# 浏览器可执行文件路径，留空则自动查找。地址栏输入 chrome://version 可查看
executable_path = ""
# 窗口尺寸。注意：最小化窗口可能导致播放进度不累加，建议保持可见
window_size = [1440, 900]
# 无头模式。强烈建议 false —— 陪伴软件的意义就是你能看见它在干活
headless = false

[course]
# 课程播放页 URL，一行一个，会按顺序依次学习
urls = [
    # "https://mooc1.chaoxing.com/mycourse/studentstudy?...",
]
# 播放倍速。超过 2.0 极易触发风控，程序会强制夹在 [0.5, 2.0]
speed = 1.5
# 是否静音
mute = true
# 单门课程最长学习分钟数，0 表示不限制。人机验证与答题耗时不计入
limit_max_minutes = 0

[zhihuishu_plan]
daily_enabled = false
questions_enabled = false
question_count = 5
# AI 回答本课程其他同学的问题，累计目标默认5条
answers_enabled = false
answer_count = 5
# wait：保持运行，次日09:00继续；end：当天结束
daily_action = "end"

[answer]
# 是否启用自动答题。关闭则遇到弹题仅暂停并提醒你
enabled = true
# 答错后是否继续换答案重试；目前仅智慧树视频弹题具备本地 DOM 反馈链路。
# 原因：答错的题平台会重新弹出，只答一次会让同一道题无限重弹，视频卡住不动。
# 开启后进入自动尝试；学习通缺少可靠反馈，可能首次提交后即停止；智慧职教弹题尚未适配。
retry_until_correct = true
# 视频弹题只在 retry_until_correct = false 时使用；独立章节测验答完后也使用此开关
auto_submit = false
# 学习通独立考试单独控制；默认由人工交卷
exam_auto_submit = false
# AI 服务商：anthropic / openai_compatible
provider = "anthropic"
# API Key。也可改用环境变量 ANTHROPIC_API_KEY / OPENAI_API_KEY
api_key = ""
# 模型。默认 claude-opus-5（最强，答题准确率优先）
# 想省钱可换 claude-sonnet-5；配合下方 cache = true，重复题目不会重复计费
model = "claude-opus-5"
# openai_compatible 时填写，例如 DeepSeek: https://api.deepseek.com/v1
base_url = ""
# 单题超时秒数
timeout = 45
# 是否启用本地题库缓存。同门课题目高度重复，开启后 AI 调用量大幅下降
cache = true

# 图形界面会在这里分别保存各服务商的密钥；仅写入本机 config.toml。
[answer.api_keys]

[runtime]
# 每次登录或课程页面验证的等待时限；至少 1 秒，超时跳过当前地址
login_timeout_seconds = 120
# 日志级别 DEBUG / INFO / WARN / ERROR
log_level = "INFO"
# 遇到人机验证时，是否发出提示音提醒你回来处理
beep_on_captcha = true
